[package]
name = "ondas"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["esynr3z"]
description = "Read-only, format-independent waveform analysis library"
license = "Apache-2.0"
repository = "https://github.com/kleverhq/ondas"
homepage = "https://github.com/kleverhq/ondas"
readme = "README.md"
documentation = "https://docs.rs/ondas"
keywords = ["waveform", "vcd", "fst", "rtl", "eda"]
categories = ["development-tools"]

[features]
fsdb-lib = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dependencies]
fst-reader = "=0.17.0"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"
toml = "0.9"

[package.metadata.docs.rs]
all-features = false
default-target = "x86_64-unknown-linux-gnu"
targets = []
