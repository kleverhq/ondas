[package]
name = "ondas"
version = "2.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["esynr3z"]
description = "Read-only, format-independent waveform analysis library"
license = "Apache-2.0"
repository = "https://github.com/kleverhq/ondas"
homepage = "https://github.com/kleverhq/ondas"
readme = "README.md"
documentation = "https://docs.rs/ondas"
keywords = ["waveform", "vcd", "fst", "rtl", "eda"]
categories = ["development-tools"]
exclude = ["fixtures/**"]

[features]
fsdb-lib = ["dep:cc"]
shm-lib = ["dep:cc"]
wlf-lib = ["dep:cc", "dep:sha2", "dep:libc"]
wdb-lib = ["dep:cc", "dep:sha2", "dep:libc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dependencies]
fst-reader = "=0.17.0"
libc = { version = "0.2", optional = true }
serde_json = "1"
blake3 = "=1.8.7"
sha2 = { version = "0.10", optional = true }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
sha2 = "0.10"

[profile.conformance]
inherits = "release"
debug-assertions = true
overflow-checks = true

[package.metadata.docs.rs]
all-features = false
default-target = "x86_64-unknown-linux-gnu"
targets = []

[[bench]]
name = "profile"
harness = false
