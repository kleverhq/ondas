name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and merged source
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B tools/repo/check_release.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - uses: docker/setup-buildx-action@v3
      - name: Build cached development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: ondas-dev:ci
          load: true
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,scope=devcontainer,mode=max
      - name: Use the built image with the public container settings
        run: |
          # The CLI's derived image must see the image loaded into host Docker.
          docker buildx use default
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('.devcontainer/devcontainer.json')
          config = json.loads(path.read_text())
          del config['build']
          config['image'] = 'ondas-dev:ci'
          Path('.devcontainer/ci').mkdir()
          Path('.devcontainer/ci/devcontainer.json').write_text(json.dumps(config))
          PY
      - name: Restore fixture provider
        uses: actions/cache@v4
        with:
          path: fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('fixtures.lock.toml') }}
      - uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/ci/devcontainer.json
          push: never
          env: GITHUB_TOKEN
          runCmd: |
            set -euo pipefail
            export ONDAS_FIXTURES="$PWD/fixtures"
            just fixtures-install
            just ci
            just msrv
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish crate from verified tag
        if: github.ref_type == 'tag'
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/ci/devcontainer.json
          push: never
          env: CARGO_REGISTRY_TOKEN
          runCmd: |
            set -euo pipefail
            test -n "$CARGO_REGISTRY_TOKEN"
            cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: public
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Release published crate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B tools/repo/check_release.py --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
